services:
  mongo:
    image: mongo:8.2
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongo:27017/bimm
      GRAPHQL_PLAYGROUND: 'true'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
